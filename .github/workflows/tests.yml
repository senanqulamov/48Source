name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.4']

    name: OS:${{ matrix.os }} / PHP:${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ansi

      - name: Install Node dependencies
        run: |
          npm ci
          npm run build

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Creating Database
        run: php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"

      - name: Preparing Laravel
        run: php artisan key:generate --force && php artisan optimize:clear

      - name: Check Route Integrity
        run: php artisan route:list

      - name: Run Migrations
        run: php artisan migrate:fresh --step --force --no-interaction --seed

      - name: Feature Tests
        id: tests
        run: ./vendor/bin/pest --ci --parallel

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: PhpStan
        if: always() && steps.tests.outcome != 'cancelled'
        run: ./vendor/bin/phpstan --configuration="phpstan.neon"
